name: Publish to npm

# Publishes the package to npm with a provenance statement, which n8n requires
# for nodes submitted for verification (mandatory since 2026-05-01) — they must
# come from CI, not a local machine.
#
# Auth is npm Trusted Publishing (OIDC): npmjs.com → n8n-nodes-dmly → Settings →
# Trusted Publisher → GitHub Actions (DMLY-IO / n8n-nodes-dmly / release.yml,
# "Allow npm publish" ticked). No NPM_TOKEN secret is needed. Provenance is only
# attached when the repository is public.
#
# To release: bump the version in package.json, then create a GitHub Release
# (or run this workflow manually).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm publish --provenance --access public
